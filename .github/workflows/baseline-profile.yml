name: Baseline Profile

# Generates the app's Baseline Profile on an x86_64 emulator (API 34) with :baselineprofile and
# uploads it. To ship it, copy the artifact's *-baseline-prof.txt over
# app/src/main/baseline-prof.txt. The app is built with x86_64 added for the emulator; the head
# unit's APK stays arm64 only.
on:
  workflow_dispatch:
  pull_request:
    branches:
      - master
    paths:
      - baselineprofile/**
      - .github/workflows/baseline-profile.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  generate:
    name: Generate Baseline Profile (emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version: 17
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      # The emulator needs hardware acceleration; let the runner's user open /dev/kvm.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Built before the emulator starts, so its boot doesn't wait on the compile.
      - name: Build the benchmark app and generator
        run: ./gradlew :app:assembleBenchmark :baselineprofile:assembleBenchmark -Psiphon.extraAbis=x86_64

      - name: Generate on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: >-
            ./gradlew :baselineprofile:connectedBenchmarkAndroidTest -Psiphon.extraAbis=x86_64
            -Pandroid.testInstrumentationRunnerArguments.androidx.benchmark.enabledRules=BaselineProfile
            -Pandroid.testInstrumentationRunnerArguments.androidx.benchmark.suppressErrors=EMULATOR

      - name: Upload the profile
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: baseline-profile
          path: |
            baselineprofile/build/outputs/connected_android_test_additional_output/**
            baselineprofile/build/outputs/androidTest-results/**
          if-no-files-found: warn
