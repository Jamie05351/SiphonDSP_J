name: Build APKs

on:
  workflow_dispatch:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
    tags:
      - v*

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build APKs
    runs-on: ubuntu-latest

    env:
      BRANCH_BUILD_TYPE: Preview
      TAG_BUILD_TYPE: Release

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version: 17
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Select build type
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            BUILD_TYPE="${TAG_BUILD_TYPE}"
          else
            BUILD_TYPE="${BRANCH_BUILD_TYPE}"
          fi
          OUTPUT_TYPE="$(echo "$BUILD_TYPE" | tr '[:upper:]' '[:lower:]')"
          echo "GRADLE_TASK=:app:assemble${BUILD_TYPE}" >> "$GITHUB_ENV"
          echo "OUTPUT_DIR=app/build/outputs/apk/${OUTPUT_TYPE}" >> "$GITHUB_ENV"
          echo "OUTPUT_TYPE=${OUTPUT_TYPE}" >> "$GITHUB_ENV"

      - name: Stamp unique CI build version
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import os
          import re
          from pathlib import Path

          config_path = Path("buildSrc/src/main/kotlin/AndroidConfig.kt")
          text = config_path.read_text(encoding="utf-8")

          run_number = int(os.environ["GITHUB_RUN_NUMBER"])
          version_code = 100000 + run_number

          version_match = re.search(r'const val versionName = "([^"]+)"', text)
          if not version_match:
              raise SystemExit("Could not find versionName in AndroidConfig.kt")

          base_version = version_match.group(1).split("-build.", 1)[0]
          version_name = f"{base_version}-build.{run_number}"

          text, code_replacements = re.subn(
              r'const val versionCode = \d+',
              f'const val versionCode = {version_code}',
              text,
              count=1,
          )
          text, name_replacements = re.subn(
              r'const val versionName = "[^"]+"',
              f'const val versionName = "{version_name}"',
              text,
              count=1,
          )

          if code_replacements != 1 or name_replacements != 1:
              raise SystemExit("Could not stamp Android version information")

          config_path.write_text(text, encoding="utf-8")
          print(f"Stamped versionName={version_name}")
          print(f"Stamped versionCode={version_code}")
          PY

      - name: Configure release signing
        if: github.event_name != 'pull_request'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "$ANDROID_KEYSTORE_BASE64" || -z "$ANDROID_KEYSTORE_PASSWORD" || -z "$ANDROID_KEY_ALIAS" || -z "$ANDROID_KEY_PASSWORD" ]]; then
            echo "Release signing secrets are missing. Add ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, and ANDROID_KEY_PASSWORD."
            exit 1
          fi

          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > release.jks
          cat > keystore.properties <<EOF
          storeFile=../release.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - name: Build APKs
        run: ./gradlew "${{ env.GRADLE_TASK }}"

      - name: Run Android unit tests and lint
        if: github.event_name == 'pull_request'
        run: ./gradlew :app:testDebugUnitTest :app:lintPreview

      - name: Run native DSP unit tests
        shell: bash
        run: |
          set -euo pipefail
          cmake -S native-tests -B build/native-tests -DCMAKE_BUILD_TYPE=Debug
          cmake --build build/native-tests --parallel
          ctest --test-dir build/native-tests --output-on-failure

      - name: Verify native libraries are packaged
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find "${{ env.OUTPUT_DIR }}" -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$APK"
          unzip -l "$APK" | grep -E 'lib/[^/]+/.*\.so$'

      - name: Prepare private APK
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/master'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p private-apk
          APK="$(find "${{ env.OUTPUT_DIR }}" -maxdepth 1 -name '*.apk' -print -quit)"
          cp "$APK" "private-apk/SiphonDSP-private-${GITHUB_SHA:0:7}.apk"

      - name: Upload APKs
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SiphonDSP-${{ env.OUTPUT_TYPE }}-apks
          path: ${{ env.OUTPUT_DIR }}/*.apk
          if-no-files-found: error

      - name: Upload private APK and reports
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SiphonDSP-private-${{ github.sha }}
          path: |
            private-apk/*.apk
            app/build/reports/tests/
            app/build/reports/lint-results-*.html
          if-no-files-found: error

  release:
    name: Create draft release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download APK artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release-apks
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: RootlessJamesDSP ${{ github.ref_name }}
          draft: true
          prerelease: false
          files: release-apks/*.apk
