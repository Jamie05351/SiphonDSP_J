name: Build APKs

on:
  workflow_dispatch:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
    tags:
      - v*

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.name }} APKs
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: RootlessFull
            gradle_variant: RootlessFull
            output_flavor: rootlessFull
            branch_build_type: Preview
            tag_build_type: Release

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          submodules: true
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          java-version: 17
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a

      - name: Select build type
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            BUILD_TYPE="${{ matrix.tag_build_type }}"
          else
            BUILD_TYPE="${{ matrix.branch_build_type }}"
          fi
          OUTPUT_TYPE="$(echo "$BUILD_TYPE" | tr '[:upper:]' '[:lower:]')"
          echo "GRADLE_TASK=:app:assemble${{ matrix.gradle_variant }}${BUILD_TYPE}" >> "$GITHUB_ENV"
          echo "OUTPUT_DIR=app/build/outputs/apk/${{ matrix.output_flavor }}/${OUTPUT_TYPE}" >> "$GITHUB_ENV"
          echo "OUTPUT_TYPE=${OUTPUT_TYPE}" >> "$GITHUB_ENV"

      - name: Stamp unique CI build version
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import os
          import re
          from pathlib import Path

          config_path = Path("buildSrc/src/main/kotlin/AndroidConfig.kt")
          text = config_path.read_text(encoding="utf-8")

          run_number = int(os.environ["GITHUB_RUN_NUMBER"])
          version_code = 100000 + run_number

          version_match = re.search(r'const val versionName = "([^"]+)"', text)
          if not version_match:
              raise SystemExit("Could not find versionName in AndroidConfig.kt")

          base_version = version_match.group(1).split("-build.", 1)[0]
          version_name = f"{base_version}-build.{run_number}"

          text, code_replacements = re.subn(
              r'const val versionCode = \d+',
              f'const val versionCode = {version_code}',
              text,
              count=1,
          )
          text, name_replacements = re.subn(
              r'const val versionName = "[^"]+"',
              f'const val versionName = "{version_name}"',
              text,
              count=1,
          )

          if code_replacements != 1 or name_replacements != 1:
              raise SystemExit("Could not stamp Android version information")

          config_path.write_text(text, encoding="utf-8")
          print(f"Stamped versionName={version_name}")
          print(f"Stamped versionCode={version_code}")
          PY

      - name: Configure release signing
        if: github.event_name != 'pull_request'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "$ANDROID_KEYSTORE_BASE64" || -z "$ANDROID_KEYSTORE_PASSWORD" || -z "$ANDROID_KEY_ALIAS" || -z "$ANDROID_KEY_PASSWORD" ]]; then
            echo "Release signing secrets are missing. Add ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, and ANDROID_KEY_PASSWORD."
            exit 1
          fi

          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > release.jks
          cat > keystore.properties <<EOF
          storeFile=../release.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - name: Build APKs
        run: ./gradlew "${{ env.GRADLE_TASK }}"

      - name: Run Android unit tests and lint
        if: github.event_name == 'pull_request'
        run: ./gradlew :app:test${{ matrix.gradle_variant }}DebugUnitTest :app:lint${{ matrix.gradle_variant }}Preview

      - name: Run native DSP unit tests
        shell: bash
        run: |
          set -euo pipefail
          cmake -S native-tests -B build/native-tests -DCMAKE_BUILD_TYPE=Debug
          cmake --build build/native-tests --parallel
          ctest --test-dir build/native-tests --output-on-failure

      - name: Verify native libraries are packaged
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find "${{ env.OUTPUT_DIR }}" -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$APK"
          unzip -l "$APK" | grep -E 'lib/[^/]+/.*\.so$'

      - name: Prepare private APK
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/master'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p private-apk
          APK="$(find "${{ env.OUTPUT_DIR }}" -maxdepth 1 -name '*.apk' -print -quit)"
          cp "$APK" "private-apk/SiphonDSP-private-${GITHUB_SHA:0:7}.apk"

      - name: Upload APKs
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ matrix.name }}JamesDSP-${{ env.OUTPUT_TYPE }}-apks
          path: ${{ env.OUTPUT_DIR }}/*.apk
          if-no-files-found: error

      - name: Upload private APK and reports
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: SiphonDSP-private-${{ github.sha }}
          path: |
            private-apk/*.apk
            app/build/reports/tests/
            app/build/reports/lint-results-*.html
          if-no-files-found: error

  release:
    name: Create draft release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download APK artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093a
        with:
          path: release-apks
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          name: RootlessJamesDSP ${{ github.ref_name }}
          draft: true
          prerelease: false
          files: release-apks/*.apk
