name: Band IR Designer Windows
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/band-ir-designer/**'
      - '.github/workflows/band-ir-designer.yml'
  pull_request:
    paths:
      - 'tools/band-ir-designer/**'
      - '.github/workflows/band-ir-designer.yml'
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: tools/band-ir-designer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/band-ir-designer/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m PyInstaller --noconfirm --clean --windowed --onedir --name BandIRDesigner app.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: BandIRDesigner-Windows
          path: tools/band-ir-designer/dist/BandIRDesigner/
