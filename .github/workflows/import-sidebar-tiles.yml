name: Import sidebar tile assets

on:
  push:
    branches:
      - agent/sidebar-tiles-resource-styling
    paths:
      - '.tmp/sidebar-tile-sources/**'

permissions:
  contents: write

jobs:
  import-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/sidebar-tiles-resource-styling
          fetch-depth: 0
      - name: Convert supplied sources to lossless PNG resources
        shell: bash
        run: |
          python3 -m pip install --quiet Pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image

          src = Path('.tmp/sidebar-tile-sources')
          dst = Path('app/src/main/res/drawable-nodpi')
          dst.mkdir(parents=True, exist_ok=True)
          mapping = {
              'ic_tile_routing.jpg': 'ic_tile_routing.png',
              'ic_tile_gains_delay.jpg': 'ic_tile_gains_delay.png',
              'ic_tile_compressor.jpg': 'ic_tile_compressor.png',
              'ic_tile_crossover.jpg': 'ic_tile_crossover.png',
              'ic_tile_eq.jpg': 'ic_tile_eq.png',
          }
          for source_name, output_name in mapping.items():
              source = src / source_name
              if not source.exists():
                  raise SystemExit(f'Missing supplied source: {source}')
              with Image.open(source) as image:
                  if image.size != (1536, 1536):
                      raise SystemExit(f'Unexpected dimensions for {source}: {image.size}')
                  image.save(dst / output_name, format='PNG', optimize=True, compress_level=9)
          PY
      - name: Remove temporary importer and commit final resources
        shell: bash
        run: |
          rm -rf .tmp/sidebar-tile-sources
          rm -f .github/workflows/import-sidebar-tiles.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A app/src/main/res/drawable-nodpi .tmp .github/workflows/import-sidebar-tiles.yml
          git commit -m 'Add full-resolution sidebar tile resources'
          git push origin HEAD:agent/sidebar-tiles-resource-styling
